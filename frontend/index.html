<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VQI Wallet</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0a0f2c;color:#fff;padding-bottom:90px}.top{display:flex;justify-content:space-between;padding:16px 20px}.logo{display:flex;gap:12px;align-items:center}.shield{width:52px;height:62px;background:linear-gradient(180deg,#1a2a5a,#0a102c);border:2px solid #e9c46a;border-radius:12px;display:grid;place-items:center;color:#e9c46a;font-weight:900}.bal{text-align:center}.bal h1{font-size:40px;margin:6px 0}.green{color:#4ade80;font-size:13px}.btns{display:flex;gap:12px;padding:16px 20px}.btn{flex:1;padding:16px;border-radius:14px;font-weight:800;border:none}.gold{background:linear-gradient(180deg,#fde8a0,#c79d3a);color:#1a1200}.outline{background:transparent;border:2px solid #c79d3a;color:#e9c46a}.card{margin:14px 20px;border:1px solid #e9c46a66;border-radius:16px;padding:16px;background:linear-gradient(180deg,#161d3f,#121636)}.card2{margin:14px 20px;background:#131a3a;border-radius:16px;padding:16px}.nav{position:fixed;bottom:0;left:0;right:0;background:#12183f;display:flex;justify-content:space-around;padding:10px 0}.nav div{color:#6b7294;font-size:11px;text-align:center}.nav .on{color:#e9c46a}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;align-items:end}.modal.show{display:flex}.modal-box{background:#131a3a;border-radius:24px 24px 0 0;width:100%;padding:20px;border-top:2px solid #e9c46a}input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a356e;background:#0a0f2c;color:#fff;margin:8px 0}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e9c46a;color:#000;padding:12px 20px;border-radius:20px;font-weight:700;display:none;z-index:30}</style></head><body><div id="toast" class="toast"></div><div class="top"><div class="logo"><div class="shield">VQI</div><b style="color:#e9c46a">VQI Wallet</b></div><div>🔔</div></div><div class="bal"><small style="color:#d4b06a">TOTAL BALANCE</small><h1 id="balance">$18,924.53</h1><div class="green">Mining Active • <span id="hashRate">2.61 MH/s</span></div></div><div class="btns"><button class="btn gold" onclick="openSend()">✈ Send</button><button class="btn outline" onclick="openReceive()">⬇ Receive</button></div><div class="card" onclick="redeemReward()"><b>Enterprise Reward $<span id="rewardAmt">250</span></b> - <small id="rewardStatus">Click to Redeem</small><div style="font-size:32px;font-weight:900;color:#e9c46a" id="rewardBig">$250</div></div><div class="card2">⛏️ <b id="mineTitle">Mining Active</b> <button onclick="toggleMine()" id="mineBtn" style="float:right;background:#e9c46a;border:none;padding:6px 12px;border-radius:8px;font-weight:700">Stop</button><div style="margin-top:10px"><small>Today's Earnings</small><div id="earn" style="color:#e9c46a;font-weight:700">+0.00167 VQI</div></div></div><div class="card2"><b>Activity</b><div id="history" style="font-size:13px;color:#8a93b8;margin-top:8px"></div></div><div class="nav"><div class="on">🏠 Home</div><div>👛 Wallet</div><div>⛏️ Mine</div><div>🎁 Rewards</div></div><div class="modal" id="m-send"><div class="modal-box"><h3>Send VQI</h3><input id="sendTo" placeholder="To address"><input id="sendAmt" type="number" placeholder="Amount"><div style="display:flex;gap:10px"><button class="btn outline" onclick="closeModals()">Cancel</button><button class="btn gold" onclick="doSend()">Send</button></div></div></div><div class="modal" id="m-receive"><div class="modal-box"><h3>Receive</h3><div style="text-align:center"><div style="width:160px;height:160px;background:#fff;color:#000;margin:0 auto;display:grid;place-items:center;border-radius:12px;font-weight:900">QR vqi1qxy...</div><p style="font-size:11px">vqi1qxy2k4e...8a9s2k</p></div><button class="btn outline" style="width:100%" onclick="closeModals()">Close</button></div></div><script>let bal=18924.53,vqi=1027.43,reward=250,mining=true,earn=0.00167,hash=2.61,hist=[];function $(i){return document.getElementById(i)}function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}function upd(){ $('balance').textContent='$'+bal.toFixed(2);$('rewardAmt').textContent=reward;$('rewardBig').textContent='$'+reward;$('earn').textContent='+'+earn.toFixed(5)+' VQI';$('hashRate').textContent=hash.toFixed(2)+' MH/s'}function openSend(){$('m-send').classList.add('show')}function openReceive(){$('m-receive').classList.add('show')}function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}function doSend(){let amt=parseFloat($('sendAmt').value);if(!amt||amt>vqi){toast('Saldo kurang bos!');return}vqi-=amt;bal=vqi*18.42;upd();hist.unshift('Sent '+amt+' VQI');render();closeModals();toast('Kirim '+amt+' VQI sukses!')}function redeemReward(){if(reward<=0){toast('Sudah claim');return}bal+=reward;vqi=bal/18.42;reward=0;$('rewardStatus').textContent='Redeemed';upd();toast('Reward $250 masuk!');hist.unshift('Redeemed $250');render()}function toggleMine(){mining=!mining;$('mineTitle').textContent=mining?'Mining Active':'Stopped';$('mineBtn').textContent=mining?'Stop':'Start';toast(mining?'Mining jalan':'Mining stop')}function render(){$('history').innerHTML=hist.slice(0,5).map(h=>'<div>'+h+'</div>').join('')}setInterval(()=>{if(!mining)return;earn+=0.000002;hash=2.5+Math.random()*0.3;if(Math.random()>0.7){let a=0.00001+Math.random()*0.00005;earn+=a;vqi+=a;bal=vqi*18.42;hist.unshift('Mined +'+a.toFixed(5)+' VQI');render()}upd()},1000);upd();</script></body></html>
